# Uploaded by .buildkite/pipeline.yml. `mirror_hardwares` is not a Buildkite key;
# upload_pipeline.py expands it from hardware.yml.

steps:
  # The compose plugin reuses an image only when meta-data names it. There is no
  # registry, so this step builds on the host and records the local tag. Later
  # steps on this queue must share this machine's Docker daemon.
  - label: ":docker: Build CI image"
    key: ci-image
    mirror_hardwares: l20_1
    host_only: true
    commands:
      - docker rmi -f "agentinfer-ci:$$BUILDKITE_BUILD_ID-gpu" || true
      - COMPOSE_BAKE=false BUILDX_NO_DEFAULT_ATTESTATIONS=1 docker compose -f docker/docker-compose.yml build --pull agentinfer-ci
      - buildkite-agent meta-data set "docker-compose-plugin-built-image-tag-agentinfer-ci-docker/docker-compose.yml" "agentinfer-ci:$$BUILDKITE_BUILD_ID-gpu"

  # GPU smoke for the AgentInfer serve flag. Not the tests/e2e suite.
  - label: "smoke: agentinfer serve"
    depends_on: ci-image
    commands:
      - AGENTINFER_E2E_MODEL=Qwen/Qwen3-0.6B pytest -sv -m gpu_test tests/agentcache/entrypoints/test_serve_flag_e2e.py
    timeout_in_minutes: 25
    mirror_hardwares: l20_1

  # Functional E2E reuses ci-image and reserves one L20 per job.
  # e2e accuracy has no ready step yet, so that group is omitted.
  - group: ":card_index_dividers: e2e function"
    depends_on: ci-image
    steps:
      # Pytest and vLLM stay root; the shared helper switches only plan-subagent bench.
      - label: "dsh swebench"
        key: function-dsh
        mirror_hardwares: l20_1
        env:
          AGENTINFER_CI_AS_ROOT: "1"
        timeout_in_minutes: 300
        commands:
          # $$ survives Buildkite upload expansion for the container shell.
          - &agentbench_user_setup |
            set -eu
            checkout_uid=$$(stat -c %u .)
            checkout_gid=$$(stat -c %g .)
            restore_checkout_owner() {
              status=$$?
              trap - EXIT
              if ! chown -R "$$checkout_uid:$$checkout_gid" .; then
                echo "ERROR: failed to restore checkout ownership" >&2
                status=1
              fi
              exit "$$status"
            }
            trap restore_checkout_owner EXIT
            id test-user >/dev/null 2>&1 || useradd -m -s /bin/bash test-user
            for extra in video render; do
              if getent group "$$extra" >/dev/null 2>&1; then
                usermod -aG "$$extra" test-user
              fi
            done
          - pytest -s -v -m "cuda and cards_1" tests/e2e/function/agentbench/test_swebench.py::test_agent_swebench --test-config-file tests/e2e/function/agentbench/cases/dsh/qwen3_coder_dsh_2x1.json
          - pytest -s -v -m "cuda and cards_1" tests/e2e/function/agentbench/test_swebench.py::test_agent_swebench --test-config-file tests/e2e/function/agentbench/cases/dsh/qwen3_coder_dsh_2x1_plan_subagent.json --benchmark-run-as-user test-user

      - label: "claude swebench"
        key: function-claude
        mirror_hardwares: l20_1
        env:
          AGENTINFER_CI_AS_ROOT: "1"
        timeout_in_minutes: 300
        commands:
          - *agentbench_user_setup
          - pytest -s -v -m "cuda and cards_1" tests/e2e/function/agentbench/test_swebench.py::test_agent_swebench --test-config-file tests/e2e/function/agentbench/cases/claude/qwen3_coder_claude_2x1_single.json
          - pytest -s -v -m "cuda and cards_1" tests/e2e/function/agentbench/test_swebench.py::test_agent_swebench --test-config-file tests/e2e/function/agentbench/cases/claude/qwen3_coder_claude_2x1_plan_subagent.json --benchmark-run-as-user test-user

      - label: "jiuwenswarm swebench"
        key: function-jiuwenswarm
        mirror_hardwares: l20_1
        env:
          AGENTINFER_CI_AS_ROOT: "1"
        timeout_in_minutes: 150
        commands:
          - *agentbench_user_setup
          - pytest -s -v -m "cuda and cards_1" tests/e2e/function/agentbench/test_swebench.py::test_agent_swebench --test-config-file tests/e2e/function/agentbench/cases/jiuwenswarm/qwen3_coder_jiuwenswarm_2x1_code_normal.json

      - label: "zcode swebench"
        key: function-zcode
        mirror_hardwares: l20_1
        env:
          AGENTINFER_CI_AS_ROOT: "1"
        timeout_in_minutes: 300
        commands:
          - *agentbench_user_setup
          - pytest -s -v -m "cuda and cards_1" tests/e2e/function/agentbench/test_swebench.py::test_agent_swebench --test-config-file tests/e2e/function/agentbench/cases/zcode/qwen3_coder_zcode_2x1_single.json
          - pytest -s -v -m "cuda and cards_1" tests/e2e/function/agentbench/test_swebench.py::test_agent_swebench --test-config-file tests/e2e/function/agentbench/cases/zcode/qwen3_coder_zcode_2x1_plan_subagent.json --benchmark-run-as-user test-user

  # cpu_small is another machine, so it builds the same Dockerfile itself.
  - label: ":docker: Build CI image (cpu)"
    key: ci-image-cpu
    mirror_hardwares: cpu_small
    host_only: true
    commands:
      - docker rmi -f "agentinfer-ci:$$BUILDKITE_BUILD_ID-cpu" || true
      - COMPOSE_BAKE=false BUILDX_NO_DEFAULT_ATTESTATIONS=1 docker compose -f docker/docker-compose.yml build --pull agentinfer-cpu
      - buildkite-agent meta-data set "docker-compose-plugin-built-image-tag-agentinfer-cpu-docker/docker-compose.yml" "agentinfer-ci:$$BUILDKITE_BUILD_ID-cpu"

  - group: ":card_index_dividers: ut"
    depends_on: ci-image-cpu
    steps:
      - label: "ut"
        commands:
          - pytest tests -sv --ignore=tests/e2e --ignore=tests/agentcache/core -m "not gpu_test and not e2e_perf"
        timeout_in_minutes: 20
        mirror_hardwares: cpu_small

  # A plain wait skips every later step when an earlier step failed, which
  # leaves this build's tagged images on the agent. Continue so cleanup still
  # runs; the build stays failed.
  - wait: ~
    continue_on_failure: true
  - label: ":broom: Cleanup GPU agent"
    mirror_hardwares: l20_1
    # Host docker prune. Do not wrap this step in the CI container.
    host_only: true
    commands:
      - docker rmi -f "agentinfer-ci:$$BUILDKITE_BUILD_ID-gpu" || true
      - docker image prune -f
  - label: ":broom: Cleanup CPU agent"
    mirror_hardwares: cpu_small
    host_only: true
    commands:
      - docker rmi -f "agentinfer-ci:$$BUILDKITE_BUILD_ID-cpu" || true
      - docker image prune -f
